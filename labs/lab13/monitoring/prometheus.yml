# Lab 13 activity - Prometheus scrapes the exporter sidecar of prod-mongo-1 (generated by prodkeys.py)
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    lab: "lab13"
rule_files:
  - /etc/lab13/alerts.yml
scrape_configs:
  - job_name: mongodb
    metrics_path: /metrics
    static_configs:
      - targets: ["prod-mongo-1:9216"]      # the sidecar shares prod-mongo-1's network namespace
        labels:
          member: prod-mongo-1
          replset: rs0
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
