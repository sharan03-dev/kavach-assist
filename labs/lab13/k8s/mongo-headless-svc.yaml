# Lab 13.2 (1/3) - headless Service: clusterIP None + selector app: mongo.
# Gives every StatefulSet pod a stable DNS name that the replica-set configuration uses:
#   mongo-0.mongo-headless-svc, mongo-1.mongo-headless-svc, mongo-2.mongo-headless-svc  (namespace lab13)
# publishNotReadyAddresses: the names exist before a pod is Ready, so rs.initiate() and heartbeats can resolve a member
# that is still starting (MongoDB decides membership itself - Kubernetes readiness must not hide a member from it).
apiVersion: v1
kind: Service
metadata:
  name: mongo-headless-svc
  namespace: lab13
  labels:
    app: mongo
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: mongo
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
